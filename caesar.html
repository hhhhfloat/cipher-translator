<!-- 凯撒移位页面结构骨架：输入框 + ROT1~ROT25 结果表格，与主页同目录，返回 index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凯撒移位 — Caesar Cipher</title>
    <link rel="stylesheet" href="caesar.css">
</head>
<body>
    <!-- @anchor: caesar_header -->
    <!-- 头部：返回主页链接、标题与说明 -->
    <header class="site-header">
        <a href="index.html" class="back-link" title="返回密码互译器">← 返回密码互译器</a>
        <div class="header-icon">🔄</div>
        <h1>凯撒移位</h1>
        <p class="subtitle">Caesar Cipher — 查看所有 25 种移位结果</p>
    </header>
    <!-- @anchor: caesar_header_end -->

    <main class="main-content">
        <!-- @anchor: caesar_input -->
        <!-- 输入区域：60 字符上限的英文文本输入与清空按钮 -->
        <section class="input-section">
            <div class="input-wrapper">
                <label for="textInput" class="input-label">输入英文文本</label>
                <div class="input-row">
                    <input
                        type="text"
                        id="textInput"
                        class="text-input"
                        placeholder="例如：HELLO WORLD"
                        maxlength="60"
                    >
                    <button id="clearBtn" class="clear-btn" title="清空">✕</button>
                </div>
                <span id="charCount" class="char-count">0 / 60</span>
            </div>
            <p class="input-hint">支持 A-Z 字母，自动展示全部 25 种移位（ROT1 ~ ROT25）</p>
        </section>
        <!-- @anchor: caesar_input_end -->

        <!-- @anchor: caesar_results -->
        <!-- 移位结果区：词典标记提示条 + 占位提示 + ROT1~ROT25 结果表格 -->
        <section class="results-section" id="resultsSection">
            <div class="word-hint" id="wordHint" style="display:none;"></div>
            <div class="placeholder" id="placeholder">输入文本以查看所有凯撒移位结果</div>
            <div class="results-table-wrapper" id="resultsTableWrapper" style="display:none;">
                <table class="results-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>移位量</th>
                            <th>简称</th>
                            <th>结果</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </section>

        <!-- @anchor: caesar_results_end -->
    </main>

    <footer class="site-footer">
        <p>凯撒移位工具 · 属于 <a href="index.html">古典密码互译器</a></p>
    </footer>

    <!-- @anchor: caesar_scripts -->
    <!-- 脚本加载：词典词查找工具 → 凯撒移位主体逻辑 -->
    <script src="modules/word-finder.js"></script>
    <script src="caesar.js"></script>


    <!-- @anchor: caesar_scripts_end -->
</body>
</html>
